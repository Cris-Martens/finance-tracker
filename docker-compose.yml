services:
  mysql:
    image: mysql:8.0
    container_name: finance-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finance
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: financeuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d # Optional: for initial SQL scripts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - finance-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-tracker-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Spring datasource configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: financeuser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      # Your custom environment variables
      FT_CRYPTO_PASSWORD: ${FT_CRYPTO_PASSWORD}
      FT_CRYPTO_SALT: ${FT_CRYPTO_SALT}

      # Spring profiles
      SPRING_PROFILES_ACTIVE: docker

      # JVM options for container environment
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - finance-network

  # Future fronted service placeholder
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: finance-tracker-frontend
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - finance-network

volumes:
  mysql-data:
    driver: local

networks:
  finance-network:
    driver: bridge